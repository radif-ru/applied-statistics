[project]
name = "applied-statistics"
version = "0.1.0"
description = "Статистические критерии, корреляционный и регрессионный анализ в Jupyter-ноутбуках"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false
exclude-newer = "2026-10-31T00:00:00Z"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "ruff>=0.17.3",
]

